name: "Google News Fetcher"

# Runs separately from main RSS fetching to:
# 1. Isolate potential failures (Puppeteer is heavier)
# 2. Run less frequently (every 3 hours) since it's slower
# 3. Provide independent debugging/monitoring

on:
  schedule:
    # Run every 3 hours at minute 30 (offset from main refresh)
    - cron: '30 */3 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  fetch-google-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Puppeteer can be slow

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Puppeteer requires Chrome/Chromium
      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Fetch Google News
        env:
          # Redis/KV for caching
          REDIS_URL: ${{ secrets.KV_URL }}
          KV_URL: ${{ secrets.KV_URL }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          # Puppeteer settings
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: '/usr/bin/chromium-browser'
        run: npx tsx scripts/fetch-google-news.ts

      - name: Report status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Google News fetch completed successfully"
          else
            echo "❌ Google News fetch failed - main RSS feeds unaffected"
          fi
