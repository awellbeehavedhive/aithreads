name: "Background Refresh Worker"

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  refresh-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Refresh Worker
        env:
          # Required for fetching news
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          # Required for AI ranking & thread generation
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Required for persistent cache (Vercel KV / Upstash)
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          # Required for Google Sheets logging
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEETS_ARTICLE_LOG_ID: ${{ secrets.GOOGLE_SHEETS_ARTICLE_LOG_ID }}
        run: npx tsx scripts/refresh-cache.ts
