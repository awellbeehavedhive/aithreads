name: "Preview Ranking Algorithm Test"

# This workflow tests the new X-inspired weighted ranking algorithm
# It runs separately from production workflows to avoid impacting live data

on:
  # Manual trigger only - for testing new ranking algorithm
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode'
        required: true
        default: 'comparison'
        type: choice
        options:
          - comparison    # Compare old vs new ranking
          - full_test     # Run full ranking pipeline with new algorithm
          - weights_sweep # Test different weight configurations
      sample_size:
        description: 'Number of articles to test (50-500)'
        required: false
        default: '100'
        type: string

jobs:
  test-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Ranking Algorithm Tests
        env:
          # Required for fetching test articles
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          # Required for AI scoring (if needed)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Read-only cache access for testing
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          # Test configuration
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size }}
        run: npx tsx scripts/test-ranking.ts

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranking-test-results
          path: |
            test-results/
            *.json
          retention-days: 7
